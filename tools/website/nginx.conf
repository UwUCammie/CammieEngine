# Include inside the HTTPS server for uwucammie.com. Files live outside the
# account service so large downloads do not occupy its Python workers.
location = /cammie-engine { return 308 /cammie-engine/; }
location = /cammie-engine/changelog { return 308 /cammie-engine/changelog/; }
location = /cammie-engine/changelog/ {
    rewrite ^ /cammie-engine/index.html last;
}
location /cammie-engine/objects/ {
    alias /srv/uwucammie/cammie-engine/objects/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
}
location /cammie-engine/releases/ {
    alias /srv/uwucammie/cammie-engine/releases/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
}
location /cammie-engine/ {
    alias /srv/uwucammie/cammie-engine/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'";
}
