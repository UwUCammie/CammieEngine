name: Windows x64 alpha

on:
  push:
    tags:
      - 'alpha-*'
      - 'v*-alpha*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-alpha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve Git-backed Haxe library revisions
        id: haxelib-revisions
        shell: pwsh
        run: |
          $repositories = @{
            hscript_ex = 'https://github.com/ianharrigan/hscript-ex'
            discord_rpc = 'https://github.com/Aidan63/linc_discord-rpc'
          }
          foreach ($name in $repositories.Keys) {
            $result = git ls-remote $repositories[$name] HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve the $name Haxe library revision."
            }
            $revision = ($result -split '\s+')[0]
            if ($revision -notmatch '^[0-9a-f]{40}$') {
              throw "Git returned an invalid $name Haxe library revision."
            }
            "$name=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Restore pinned Windows toolchain and Haxe libraries
        uses: actions/cache@v4
        with:
          path: |
            .tools
            .haxelib
          key: windows-dependencies-${{ runner.os }}-${{ hashFiles('run.bat', 'tools/patch_*.py', 'tools/patch_flixel_fallback.ps1', 'tools/install_codename_3d.py') }}-${{ steps.haxelib-revisions.outputs.hscript_ex }}-${{ steps.haxelib-revisions.outputs.discord_rpc }}

      - name: Set up Python for the canonical Windows build
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build with the pinned portable toolchain
        shell: cmd
        run: call run.bat build

      - name: Package runtime, notices, and checksum
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "ci-$env:GITHUB_RUN_NUMBER"
          }
          python tools/package_windows_release.py `
            --runtime export/release/windows/bin `
            --output-dir dist `
            --tag $tag

      - name: Upload downloadable Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: CammieEngine-Windows-x64-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
